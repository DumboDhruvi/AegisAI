name: AegisAI CI/CD Quality Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main, "feature/*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Type Check, and Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code formatting check (ruff)
        run: |
          ruff format --check src tests

      - name: Static linting check (ruff)
        run: |
          ruff check src tests

      - name: Static type checking (mypy)
        run: |
          mypy src tests

      - name: Run unit and integration tests with coverage
        run: |
          pytest --cov=aegis --cov-fail-under=90

      - name: Run AI Quality Gate Verification (M11)
        run: |
          python -m aegis.cli.ci_gate \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --pipeline-id "gh-actions-${{ github.run_id }}"
